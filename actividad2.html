
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

    <style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    padding: 20px;
  }

  form {
    width: 300px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 8px;
  }

  div {
    margin-bottom: 12px;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
  }

  button {
    padding: 8px 15px;
    background-color: #4334e6;
    color: white;
    border: none;
    cursor: pointer;
  }

  label {
    display: block;
  }
</style>

  <form action="" id="formBuscador">
    <div>
      <input type="text" id="idnave" placeholder="Ejem. 1" required>
      <button type="submit">Buscar</button>
    </div>

    <div>
      <label for="nombre">Nombre Nave Espacial</label>
      <input type="text" id="nombre">
    </div>

    <div>
      <label for="modelo">Modelo</label>
      <input type="text" id="modelo">
    </div>

    <div>
      <label for="tripulacion">Tripulación</label>
      <input type="text" id="tripulacion">
    </div>

    <div>
      <label for="pasajeros">Pasajeros</label>
      <input type="text" id="pasajeros" readonly>
    </div>

    <div>
      <label for="consumibles">Consumibles</label>
      <input type="text" id="consumibles" readonly>
    </div>
  </form>

  <script>

    const formulario = document.getElementById('formBuscador')
    const id = document.getElementById('idnave')
    const nombre = document.getElementById('nombre')
    const modelo = document.getElementById('modelo')
    const tripulacion= document.getElementById('tripulacion')
    const pasajeros = document.getElementById('pasajeros')
    const consumibles = document.getElementById('consumibles')


    formulario.addEventListener("submit", (event) => {
      event.preventDefault()
      obtenerNave(id.value)
    })

    async function obtenerNave(id) {
      const API_URL = `https://swapi.dev/api/starships/${id}`

      try {
        const respuesta = await fetch(API_URL)

        if (!respuesta.ok) {
          if (respuesta.status === 404) {
            nombre.value = ''
            modelo.value = ''
            tripulacion.value = ''
            pasajeros.value = ''
            consumibles.value = ''

            alert('No existe esta nave espacial')
          }

          throw new Error('Error de comunicación')
        }

        const datos = await respuesta.json()


        nombre.value = datos.name
        modelo.value = datos.model
        tripulacion.value = datos.crew
        pasajeros.value = datos.passengers
        consumibles.value = datos.consumables

      } catch (e) {
        console.error(e)
      }
    }
  </script>

</body>
</html>
